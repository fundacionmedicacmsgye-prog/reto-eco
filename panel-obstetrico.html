<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Reto ECO Materno-Fetal | FMC</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --scan-deep:#0B1520;
    --scan-mid:#122334;
    --echo:#6FE3D4;
    --echo-dim:#2C7A70;
    --warm:#FFB65C;
    --coral:#FF8A7A;
    --bone:#F2F5F7;
    --gray:#93A5B3;
    --card:#0F1E2D;
    --border:rgba(147,165,179,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--scan-deep);color:var(--bone);
    min-height:100vh;min-height:100dvh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 60px}
  .hidden{display:none!important}

  h1{
    font-family:'Manrope',sans-serif;font-weight:800;
    font-size:22px;letter-spacing:-.3px;
  }
  .sub{font-size:13px;color:var(--gray);margin-top:4px}

  /* ===== PIN ===== */
  .pin-box{max-width:340px;margin:18vh auto 0;text-align:center}
  .pin-box h1{margin-bottom:6px}
  .pin-box p{font-size:13.5px;color:var(--gray);margin-bottom:22px}
  .pin-box input{
    width:100%;padding:16px;text-align:center;
    font-size:24px;letter-spacing:.4em;font-weight:700;
    background:var(--card);border:1.5px solid var(--border);
    border-radius:13px;color:var(--bone);margin-bottom:14px;
  }
  .pin-box input:focus{outline:none;border-color:var(--echo)}
  .btn{
    display:block;width:100%;padding:15px;border:none;border-radius:13px;
    background:linear-gradient(135deg,var(--echo) 0%,#4FC7B8 100%);
    color:#062019;font-family:'Manrope',sans-serif;font-weight:800;font-size:16px;
    cursor:pointer;
  }
  .btn:disabled{opacity:.55}
  .pin-error{color:var(--coral);font-size:13px;margin-top:12px;display:none}

  /* ===== BARRA SUPERIOR ===== */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .btn-mini{
    background:var(--card);border:1px solid var(--border);color:var(--gray);
    padding:9px 13px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;
  }

  /* ===== RESUMEN ===== */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  .stat{
    background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:11px 8px;text-align:center;
  }
  .stat .n{font-family:'Manrope',sans-serif;font-weight:800;font-size:20px}
  .stat .l{font-size:10.5px;color:var(--gray);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
  .stat.a .n{color:var(--echo)}
  .stat.b .n{color:var(--warm)}
  .stat.c .n{color:var(--gray)}

  /* ===== FILTROS ===== */
  .filtros{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
  .filtro{
    background:var(--card);border:1.5px solid var(--border);color:var(--gray);
    padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;
    cursor:pointer;white-space:nowrap;flex:none;
  }
  .filtro.activo{border-color:var(--echo);color:var(--echo)}
  .filtro.alerta.activo{border-color:var(--coral);color:var(--coral)}

  /* ===== BUSCADOR ===== */
  .buscador{margin-bottom:14px}
  .buscador input{
    width:100%;padding:13px 14px;border-radius:12px;
    background:var(--card);border:1.5px solid var(--border);
    color:var(--bone);font-size:14.5px;font-family:'Inter',sans-serif;
  }
  .buscador input:focus{outline:none;border-color:var(--echo)}
  .buscador input::placeholder{color:var(--gray)}
  .conteo{font-size:12px;color:var(--gray);margin:-8px 0 12px}

  /* ===== TARJETA DE LEAD ===== */
  .lead{
    background:var(--card);border:1px solid var(--border);
    border-radius:15px;padding:16px;margin-bottom:12px;
  }
  .lead-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
  .lead-nombre{font-family:'Manrope',sans-serif;font-weight:800;font-size:16.5px;line-height:1.25}
  .lead-meta{font-size:12.5px;color:var(--gray);margin-top:3px}
  .badge{
    flex:none;font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;
    padding:5px 11px;border-radius:99px;border:1.5px solid;
  }
  .badge.A{color:var(--echo);border-color:var(--echo)}
  .badge.B{color:var(--warm);border-color:var(--warm)}
  .badge.C{color:var(--gray);border-color:var(--gray)}

  .lead.malo{border-color:rgba(255,138,122,.5);background:linear-gradient(180deg,rgba(255,138,122,.06),var(--card) 40px)}
  .aviso-malo{
    display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
    color:var(--coral);background:rgba(255,138,122,.12);border:1px solid rgba(255,138,122,.4);
    padding:4px 9px;border-radius:99px;margin-bottom:8px;
  }

  .lead-datos{
    display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;
    font-size:12.5px;color:var(--gray);margin:10px 0;line-height:1.45;
  }
  .lead-datos b{color:var(--bone);font-weight:600}

  .lead-msg{
    background:var(--scan-mid);border:1px solid var(--border);
    border-radius:11px;padding:12px;font-size:13px;line-height:1.55;
    color:var(--bone);margin:10px 0;max-height:110px;overflow:auto;
    white-space:pre-wrap;
  }
  .lead-msg.vacio{color:var(--gray);font-style:italic}

  .lead-acciones{display:flex;gap:8px;margin-top:10px}
  .btn-accion{
    flex:1;padding:12px 8px;border:none;border-radius:11px;
    font-family:'Manrope',sans-serif;font-weight:800;font-size:13.5px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
    text-decoration:none;
  }
  .btn-copiar{background:var(--scan-mid);color:var(--echo);border:1.5px solid var(--echo-dim)}
  .btn-wa{background:linear-gradient(135deg,#38D67A 0%,#25B864 100%);color:#06200F}

  .lead-estado{margin-top:10px;display:flex;align-items:center;gap:8px}
  .lead-estado label{font-size:12px;color:var(--gray);flex:none}
  .lead-estado select{
    flex:1;padding:10px 12px;border-radius:10px;
    background:var(--scan-mid);border:1.5px solid var(--border);
    color:var(--bone);font-size:13.5px;appearance:none;
  }
  .lead-estado select:focus{outline:none;border-color:var(--echo)}

  .vacio-lista{text-align:center;color:var(--gray);font-size:14px;padding:40px 20px}
  .cargando{text-align:center;color:var(--gray);padding:40px}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--echo);color:#062019;font-weight:700;font-size:14px;
    padding:12px 22px;border-radius:99px;display:none;z-index:50;
  }

  /* ===== BITÁCORA ===== */
  .bitacora{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
  .bitacora-titulo{font-size:12px;color:var(--gray);font-weight:600;margin-bottom:6px}
  .bitacora-log{max-height:130px;overflow:auto;margin-bottom:8px}
  .bitacora-log.vacio{color:var(--gray);font-style:italic;font-size:12.5px}
  .bitacora-entrada{
    font-size:12.5px;line-height:1.5;padding:6px 0;border-bottom:1px dashed var(--border);
  }
  .bitacora-entrada:last-child{border-bottom:none}
  .bitacora-entrada .sello{color:var(--echo);font-weight:700;margin-right:5px}
  .bitacora-nueva{display:flex;gap:6px}
  .bitacora-nueva input{
    flex:1;padding:10px 12px;border-radius:10px;
    background:var(--scan-mid);border:1.5px solid var(--border);
    color:var(--bone);font-size:13px;
  }
  .bitacora-nueva input:focus{outline:none;border-color:var(--echo)}
  .bitacora-nueva button{
    flex:none;padding:0 14px;border:none;border-radius:10px;
    background:var(--echo-dim);color:var(--echo);font-weight:800;font-size:13px;cursor:pointer;
  }

  /* ===== VISTA DE LISTA ===== */
  .tabla-lista{width:100%;border-collapse:collapse;font-size:12.5px}
  .tabla-lista th{
    text-align:left;color:var(--gray);font-weight:600;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.04em;padding:8px 6px;border-bottom:1px solid var(--border);
    position:sticky;top:0;background:var(--scan-deep);
  }
  .tabla-lista td{padding:9px 6px;border-bottom:1px solid var(--border);vertical-align:top}
  .fila-lista{cursor:pointer}
  .fila-lista:hover{background:rgba(111,227,212,.05)}
  .fila-lista.malo{background:rgba(255,138,122,.06)}
  .fila-lista .mini{display:block;color:var(--gray);font-size:11px;margin-top:1px}
  .fila-lista .badge{font-size:11px;padding:3px 8px}
  .fila-detalle td{padding:0;border-bottom:1px solid var(--border)}
  .fila-detalle .lead{border-radius:0;border:none;margin-bottom:0;background:var(--scan-mid)}
  .tabla-scroll{overflow-x:auto;margin:0 -16px;padding:0 16px}
</style>
</head>
<body>

<!-- ===== PANTALLA PIN ===== -->
<div class="pin-box" id="vistaPIN">
  <h1>Panel Reto ECO</h1>
  <p>FMC · Ecografía Obstétrica · Acceso restringido</p>
  <input type="password" id="inpPIN" inputmode="numeric" maxlength="8" placeholder="••••">
  <button class="btn" id="btnEntrar">Entrar</button>
  <p class="pin-error" id="pinError">PIN incorrecto. Intenta de nuevo.</p>
</div>

<!-- ===== PANEL ===== -->
<div class="wrap hidden" id="vistaPanel">
  <div class="topbar">
    <div>
      <h1>Leads Reto ECO Materno-Fetal</h1>
      <div class="sub" id="subFecha"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn-mini" id="btnVista">☰ Lista</button>
      <button class="btn-mini" id="btnDescargar">⬇ CSV</button>
      <button class="btn-mini" id="btnRefrescar">↻ Actualizar</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="stTotal">0</div><div class="l">Total</div></div>
    <div class="stat a"><div class="n" id="stA">0</div><div class="l">Cat. A</div></div>
    <div class="stat b"><div class="n" id="stB">0</div><div class="l">Cat. B</div></div>
    <div class="stat c"><div class="n" id="stC">0</div><div class="l">Cat. C</div></div>
  </div>

  <div class="buscador">
    <input type="text" id="inpBuscar" placeholder="Buscar por nombre, WhatsApp, país, objetivo...">
  </div>

  <div class="filtros" id="filtros">
    <button class="filtro activo" data-f="todos">Todos</button>
    <button class="filtro" data-f="A">Prioridad A</button>
    <button class="filtro" data-f="B">Prioridad B</button>
    <button class="filtro" data-f="C">Prioridad C</button>
    <button class="filtro" data-f="nuevo">Sin contactar</button>
    <button class="filtro" data-f="contactado">Contactados</button>
    <button class="filtro alerta" data-f="numero_incorrecto">Número incorrecto</button>
  </div>

  <div class="conteo" id="conteo"></div>

  <div id="lista"><div class="cargando">Cargando leads...</div></div>
</div>

<div class="toast" id="toast">Copiado ✓</div>

<script>
const FN = '/.netlify/functions/leads-obstetrico';
let PIN = sessionStorage.getItem('pin_reto_eco') || '';
let LEADS = [];
let FILTRO = 'todos';
let BUSQUEDA = '';
let VISTA = 'tarjetas';
try { VISTA = localStorage.getItem('vista_reto_eco') || 'tarjetas'; } catch (e) {}

const COLUMNAS_CSV = [
  'id','created_at','nombre','whatsapp','email','pais','perfil_profesional','pacientes_mes',
  'realiza_ecografias','etapa_profesional','puntaje_conocimiento','ha_visto_ofertas_eco',
  'percepcion_ventaja','estudios_potenciales_mes','valor_promedio_eco','objetivo_principal',
  'objecion_principal','potencial_mensual','nivel_resultado','avatar','lead_score','categoria_lead',
  'estado','asesor_asignado','mensaje_apertura','reporte_medico','notas','completo_reto',
  'pantalla_abandono','fuente','respuestas_detalle'
];

const T = {
  perfil: { general:'Médico general', rural:'Médico rural', residente:'Residente',
    especialista:'Especialista', emergencia:'Médico de emergencia', otro:'Otro prof. salud' },
  nivel: { explorador:'Explorador', en_desarrollo:'En Desarrollo',
    clinico_progreso:'Clínico en Progreso', avanzado:'Avanzado' },
  avatar: { emprendedor:'Emprendedor', empleable:'Empleable', clinico:'Clínico' },
  objecion: { falta_formacion:'Falta formación', sin_equipo:'No tiene ecógrafo',
    no_conoce:'No conoce el proceso', falta_tiempo:'Falta de tiempo',
    costo:'Costo', inseguridad:'Duda poder aprender' },
  objetivo: { evaluar_pacientes:'Evaluar mejor', complementar:'Complementar consulta',
    centro_medico:'Trabajar en centro médico', nuevo_servicio:'Nuevo servicio',
    perfil_laboral:'Mejorar perfil laboral', emprender:'Emprender' }
};

document.getElementById('btnEntrar').addEventListener('click', entrar);
document.getElementById('inpPIN').addEventListener('keyup', e => { if (e.key === 'Enter') entrar(); });
document.getElementById('btnRefrescar').addEventListener('click', cargarLeads);
document.getElementById('btnDescargar').addEventListener('click', descargarCSV);
document.getElementById('btnVista').addEventListener('click', alternarVista);
document.getElementById('inpBuscar').addEventListener('input', e => {
  BUSQUEDA = normalizar(e.target.value);
  render();
});
document.querySelectorAll('.filtro').forEach(f => {
  f.addEventListener('click', () => {
    document.querySelectorAll('.filtro').forEach(x => x.classList.remove('activo'));
    f.classList.add('activo');
    FILTRO = f.dataset.f;
    render();
  });
});

function normalizar(s){
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}

if (PIN) { verificarYEntrar(); }

async function entrar(){
  PIN = document.getElementById('inpPIN').value.trim();
  if (!PIN) return;
  verificarYEntrar();
}

async function verificarYEntrar(){
  const btn = document.getElementById('btnEntrar');
  btn.disabled = true; btn.textContent = 'Verificando...';
  try {
    const r = await fetch(FN, { headers: { 'x-pin': PIN } });
    if (r.status === 401) {
      document.getElementById('pinError').style.display = 'block';
      sessionStorage.removeItem('pin_reto_eco');
    } else if (r.ok) {
      sessionStorage.setItem('pin_reto_eco', PIN);
      const data = await r.json();
      LEADS = data.leads || [];
      document.getElementById('vistaPIN').classList.add('hidden');
      document.getElementById('vistaPanel').classList.remove('hidden');
      render();
    }
  } catch (e) {
    document.getElementById('pinError').textContent = 'Error de conexión. Intenta de nuevo.';
    document.getElementById('pinError').style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'Entrar';
}

async function cargarLeads(){
  document.getElementById('lista').innerHTML = '<div class="cargando">Actualizando...</div>';
  try {
    const r = await fetch(FN, { headers: { 'x-pin': PIN } });
    const data = await r.json();
    if (data.ok) LEADS = data.leads || [];
  } catch (e) {}
  render();
}

function listaFiltrada(){
  let lista = [...LEADS];
  if (FILTRO === 'A' || FILTRO === 'B' || FILTRO === 'C') {
    lista = lista.filter(l => l.categoria_lead === FILTRO);
  } else if (FILTRO === 'nuevo') {
    lista = lista.filter(l => (l.estado || 'nuevo') === 'nuevo');
  } else if (FILTRO === 'contactado') {
    lista = lista.filter(l => ['contactado','en_conversacion','matriculado'].includes(l.estado));
  } else if (FILTRO === 'numero_incorrecto') {
    lista = lista.filter(l => l.estado === 'numero_incorrecto');
  }

  if (BUSQUEDA) {
    lista = lista.filter(l => {
      const campo = normalizar([
        l.nombre, l.whatsapp, l.pais,
        T.perfil[l.perfil_profesional], T.avatar[l.avatar],
        T.objetivo[l.objetivo_principal], T.objecion[l.objecion_principal],
        l.estado
      ].join(' '));
      return campo.includes(BUSQUEDA);
    });
  }

  // orden: categoría A primero, luego score, luego más recientes
  const pesoCat = { A:0, B:1, C:2 };
  lista.sort((x,y) => {
    const c = (pesoCat[x.categoria_lead] ?? 3) - (pesoCat[y.categoria_lead] ?? 3);
    if (c !== 0) return c;
    const s = (y.lead_score || 0) - (x.lead_score || 0);
    if (s !== 0) return s;
    return new Date(y.created_at) - new Date(x.created_at);
  });
  return lista;
}

function render(){
  const hoy = new Date();
  document.getElementById('subFecha').textContent =
    hoy.toLocaleDateString('es-EC', { weekday:'long', day:'numeric', month:'long' });

  document.getElementById('stTotal').textContent = LEADS.length;
  document.getElementById('stA').textContent = LEADS.filter(l => l.categoria_lead === 'A').length;
  document.getElementById('stB').textContent = LEADS.filter(l => l.categoria_lead === 'B').length;
  document.getElementById('stC').textContent = LEADS.filter(l => l.categoria_lead === 'C').length;

  const lista = listaFiltrada();
  document.getElementById('conteo').textContent =
    'Mostrando ' + lista.length + ' de ' + LEADS.length + ' leads';

  document.getElementById('btnVista').textContent = VISTA === 'lista' ? '▦ Tarjetas' : '☰ Lista';

  const $l = document.getElementById('lista');
  if (!lista.length) {
    $l.innerHTML = '<div class="vacio-lista">' +
      (BUSQUEDA ? 'Ningún lead coincide con tu búsqueda.' : 'No hay leads en este filtro todavía.') +
      '</div>';
    return;
  }

  if (VISTA === 'lista') {
    renderLista($l, lista);
  } else {
    $l.innerHTML = lista.map(tarjetaHTML).join('');
  }
}

function alternarVista(){
  VISTA = VISTA === 'lista' ? 'tarjetas' : 'lista';
  try { localStorage.setItem('vista_reto_eco', VISTA); } catch (e) {}
  render();
}

function tarjetaHTML(l){
  const fecha = new Date(l.created_at).toLocaleDateString('es-EC', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
  const waDigitos = (l.whatsapp || '').replace(/\D/g, '');
  const msg = l.mensaje_apertura || '';
  const linkWA = 'https://wa.me/' + waDigitos + (msg ? '?text=' + encodeURIComponent(msg) : '');
  const esMalo = l.estado === 'numero_incorrecto';
  return `
    <div class="lead ${esMalo ? 'malo' : ''}">
      ${esMalo ? '<span class="aviso-malo">⚠ Número incorrecto / no corresponde</span>' : ''}
      <div class="lead-top">
        <div>
          <div class="lead-nombre">${esc(l.nombre || 'Sin nombre')}</div>
          <div class="lead-meta">${esc(l.pais || '')} · ${T.perfil[l.perfil_profesional] || ''} · ${fecha}</div>
        </div>
        <span class="badge ${l.categoria_lead || 'C'}">${l.categoria_lead || '?'} · ${l.lead_score ?? 0}</span>
      </div>
      <div class="lead-datos">
        <span>Nivel: <b>${T.nivel[l.nivel_resultado] || '—'} (${l.puntaje_conocimiento ?? '—'}%)</b></span>
        <span>Avatar: <b>${T.avatar[l.avatar] || '—'}</b></span>
        <span>Objetivo: <b>${T.objetivo[l.objetivo_principal] || '—'}</b></span>
        <span>Objeción: <b>${T.objecion[l.objecion_principal] || '—'}</b></span>
        <span>Potencial: <b>$${(l.potencial_mensual || 0).toLocaleString('en-US')}/mes</b></span>
        <span>WhatsApp: <b>${esc(l.whatsapp || '—')}</b></span>
        ${l.respuestas_detalle && l.respuestas_detalle.universidad ? `<span>Universidad: <b>${esc(l.respuestas_detalle.universidad)}</b></span>` : ''}
        ${l.respuestas_detalle && l.respuestas_detalle.conoce_reglateco ? `<span>¿Conoce REGLATECO?: <b>${l.respuestas_detalle.conoce_reglateco === 'si' ? 'Sí' : 'No'}</b></span>` : ''}
      </div>
      <div class="lead-msg ${msg ? '' : 'vacio'}">${msg ? esc(msg) : 'Sin mensaje generado (lead guardado por respaldo directo).'}</div>
      <div class="lead-acciones">
        <button class="btn-accion btn-copiar" onclick="copiar('${l.id}')">⧉ Copiar mensaje</button>
        <a class="btn-accion btn-wa" href="${linkWA}" target="_blank" rel="noopener">WhatsApp →</a>
      </div>
      ${l.reporte_medico ? `<div class="lead-acciones"><button class="btn-accion btn-copiar" onclick="copiarReporte('${l.id}')">📄 Copiar reporte completo del médico</button></div>` : ''}
      <div class="lead-estado">
        <label>Estado:</label>
        <select onchange="cambiarEstado('${l.id}', this.value)">
          ${opcionEstado(l.estado)}
        </select>
      </div>
      <div class="bitacora">
        <div class="bitacora-titulo">Bitácora de contacto</div>
        <div class="bitacora-log ${l.notas ? '' : 'vacio'}" id="log-${l.id}">${bitacoraHTML(l.notas)}</div>
        <div class="bitacora-nueva">
          <input type="text" id="nota-${l.id}" placeholder="Ej: Llamé, no contestó / Número no corresponde / Ya se matriculó en otro lugar..." onkeyup="if(event.key==='Enter') agregarNota('${l.id}')">
          <button onclick="agregarNota('${l.id}')">+ Agregar</button>
        </div>
      </div>
    </div>`;
}

function renderLista($l, lista){
  const filas = lista.map(l => {
    const fecha = new Date(l.created_at).toLocaleDateString('es-EC', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
    const esMalo = l.estado === 'numero_incorrecto';
    const waDigitos = (l.whatsapp || '').replace(/\D/g, '');
    const msg = l.mensaje_apertura || '';
    const linkWA = 'https://wa.me/' + waDigitos + (msg ? '?text=' + encodeURIComponent(msg) : '');
    return `
    <tr class="fila-lista ${esMalo ? 'malo' : ''}" onclick="toggleFila('${l.id}')">
      <td>${fecha}</td>
      <td><b>${esc(l.nombre || 'Sin nombre')}</b><span class="mini">${esc(l.pais || '')}</span></td>
      <td><span class="badge ${l.categoria_lead || 'C'}">${l.categoria_lead || '?'}·${l.lead_score ?? 0}</span></td>
      <td>${T.nivel[l.nivel_resultado] || '—'}</td>
      <td>${esc(T_ESTADO[l.estado] || 'Nuevo')}</td>
      <td><a href="${linkWA}" target="_blank" rel="noopener" onclick="event.stopPropagation()">WhatsApp →</a></td>
    </tr>
    <tr class="fila-detalle hidden" id="fd-${l.id}"><td colspan="6">${tarjetaHTML(l)}</td></tr>`;
  }).join('');

  $l.innerHTML = `<div class="tabla-scroll"><table class="tabla-lista">
    <thead><tr>
      <th>Fecha</th><th>Nombre</th><th>Cat.</th><th>Nivel</th><th>Estado</th><th>Contacto</th>
    </tr></thead>
    <tbody>${filas}</tbody>
  </table></div>`;
}

function toggleFila(id){
  const el = document.getElementById('fd-' + id);
  if (el) el.classList.toggle('hidden');
}

const T_ESTADO = {
  nuevo:'Nuevo', contactado:'Contactado', en_conversacion:'En conversación',
  matriculado:'Matriculado ✓', descartado:'Descartado', numero_incorrecto:'Número incorrecto'
};

function opcionEstado(actual){
  const estados = [
    ['nuevo','Nuevo'], ['contactado','Contactado'], ['en_conversacion','En conversación'],
    ['matriculado','Matriculado ✓'], ['numero_incorrecto','Número incorrecto ✕'], ['descartado','Descartado']
  ];
  return estados.map(([v,t]) =>
    `<option value="${v}" ${ (actual||'nuevo') === v ? 'selected' : '' }>${t}</option>`
  ).join('');
}

function bitacoraHTML(notas){
  if (!notas) return 'Sin entradas todavía.';
  return notas.split('\n').filter(Boolean).map(linea => {
    const m = linea.match(/^\[([^\]]+)\]\s*(.*)$/);
    if (m) return `<div class="bitacora-entrada"><span class="sello">[${esc(m[1])}]</span>${esc(m[2])}</div>`;
    return `<div class="bitacora-entrada">${esc(linea)}</div>`;
  }).join('');
}

async function agregarNota(id){
  const $inp = document.getElementById('nota-' + id);
  if (!$inp) return;
  const texto = $inp.value.trim();
  if (!texto) return;
  const l = LEADS.find(x => x.id === id);
  if (!l) return;
  const ahora = new Date();
  const sello = ahora.toLocaleDateString('es-EC', { day:'2-digit', month:'2-digit' }) + ' ' +
    ahora.toLocaleTimeString('es-EC', { hour:'2-digit', minute:'2-digit' });
  const entrada = `[${sello}] ${texto}`;
  const notasNuevas = entrada + (l.notas ? '\n' + l.notas : '');
  $inp.disabled = true;
  try {
    await fetch(FN, {
      method: 'POST',
      headers: { 'x-pin': PIN, 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, notas: notasNuevas })
    });
    l.notas = notasNuevas;
    render();
  } catch (e) {
    $inp.disabled = false;
  }
}

function copiar(id){
  const l = LEADS.find(x => x.id === id);
  if (!l || !l.mensaje_apertura) return;
  navigator.clipboard.writeText(l.mensaje_apertura).then(() => {
    const t = document.getElementById('toast');
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 1600);
  });
}

function copiarReporte(id){
  const l = LEADS.find(x => x.id === id);
  if (!l || !l.reporte_medico) return;
  navigator.clipboard.writeText(l.reporte_medico).then(() => {
    const t = document.getElementById('toast');
    t.textContent = 'Reporte copiado ✓';
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; t.textContent = 'Copiado ✓'; }, 1600);
  });
}

async function cambiarEstado(id, estado){
  try {
    await fetch(FN, {
      method: 'POST',
      headers: { 'x-pin': PIN, 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, estado })
    });
    const l = LEADS.find(x => x.id === id);
    if (l) l.estado = estado;
    render();
  } catch (e) {}
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function celdaCSV(valor){
  if (valor === null || valor === undefined) return '';
  let s = typeof valor === 'object' ? JSON.stringify(valor) : String(valor);
  if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function descargarCSV(){
  // exporta lo que está visible ahora mismo (respeta el filtro y la búsqueda activos)
  const filas = listaFiltrada();
  if (!filas.length) return;
  const encabezado = COLUMNAS_CSV.join(',');
  const cuerpo = filas.map(l => COLUMNAS_CSV.map(c => celdaCSV(l[c])).join(',')).join('\n');
  const csv = '﻿' + encabezado + '\n' + cuerpo; // BOM: para que Excel muestre bien acentos/ñ
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'leads_reto_eco_obstetrico_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
